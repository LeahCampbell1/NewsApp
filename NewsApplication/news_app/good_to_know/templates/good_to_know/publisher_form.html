{% extends 'base.html' %}

{% block content %}

<h2>{{ page_title }}</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label for="name" class="form-label">
            Publisher Name
        </label>

        <input type="text" name="name" id="name" class="form-control" placeholder="Enter publisher name" required>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">
            Publisher Description
        </label>

        <textarea name="description" id="description" class="form-control" rows="4"
            placeholder="Describe your publisher"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Create Publisher
    </button>

    <a href="{% url 'editor_dashboard' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
